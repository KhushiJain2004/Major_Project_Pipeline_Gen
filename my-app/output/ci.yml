name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_test:
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ()
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ""

      - name: Build
        run: javac -d out $(find src -name '*.java' 2>/dev/null)



